name: Create release

on:
  workflow_dispatch:
    inputs:
      bump_rule:
        type: choice
        description: How to bump the project's version (see https://docs.astral.sh/uv/reference/cli/#uv-version)
        options:
          - patch
          - minor
          - major
          - alpha
          - beta
          - rc
          - dev
        required: true

jobs:
  bump-version:
    name: "Bump version and create changelog"
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    runs-on: ubuntu-latest
    env:
      CI_COMMIT_EMAIL: "ci-runner@openmethane.invalid"
    outputs:
      release-notes: ${{ steps.release-notes.outputs.RELEASE_BODY }}
      release-version: ${{ steps.release-version.outputs.RELEASE_VERSION }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Determine release version
        id: release-version
        run: |
          BUMP="${{ github.event.inputs.bump_rule }}"
          # patch is already bumped for pre-release, "stable" will remove "dev"
          [[ $BUMP == "patch" ]] && BUMP="stable"
          
          BASE_VERSION=`uv version --short`
          NEW_VERSION=`uv version --short --bump $BUMP`
          echo "BASE_VERSION=$BASE_VERSION" >> $GITHUB_ENV
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "RELEASE_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      # Generates changelog text without removing fragments, for use later in the release
      - name: Generate release notes
        id: release-notes
        run: |
          echo 'RELEASE_BODY<<EOF' >> $GITHUB_OUTPUT
          uvx towncrier build --draft --version "v$NEW_VERSION" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Bump version and generate changelog
        run: |
          git config --global user.name "$GITHUB_ACTOR"
          git config --global user.email "$CI_COMMIT_EMAIL"

          # Bump
          echo "Bumping version $BASE_VERSION > $NEW_VERSION"
          uvx towncrier build --yes --version v$NEW_VERSION
          git commit -a -m "bump: version $BASE_VERSION -> $NEW_VERSION"
          git tag v$NEW_VERSION

      - name: Bump to pre-release version
        run: |
          git config --global user.name "$GITHUB_ACTOR"
          git config --global user.email "$CI_COMMIT_EMAIL"

          # Bump to pre-release so that future commits do not have the same
          # version as the tagged commit
          NEXT_VERSION=`uv version --short --bump patch --bump dev`
          echo "Bumping version $NEW_VERSION > $NEXT_VERSION"
          git commit -a -m "bump(pre-release): version $NEW_VERSION > $NEXT_VERSION"
          git push && git push --tags

  # Builds the package from the tagged commit and tests it. The release
  # is only created if this passes, so a release never exists without its package.
  build-package:
    name: Build and test package
    needs: bump-version
    uses: ./.github/workflows/build-package.yaml
    with:
      ref: v${{ needs.bump-version.outputs.release-version }}
    permissions:
      contents: read

  publish-release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [bump-version, build-package]
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: debs
          path: dist

      - name: Check the package version matches the tag
        env:
          TAG_VERSION: ${{ needs.bump-version.outputs.release-version }}
        run: |
          EXPECTED=$(sed -E 's/\.?(dev|a|b|rc)([0-9]+)/~\1\2/g' <<<"$TAG_VERSION")
          for deb in dist/*.deb; do
            [ "$(dpkg-deb -f "$deb" Version)" = "$EXPECTED" ] || { echo "$deb does not have version $EXPECTED"; exit 1; }
          done
          # GitHub turns ~ in asset names into ., so name the files that way
          # before checksumming, and SHA256SUMS lists the names of the assets
          for deb in dist/*.deb; do
            [ "$deb" = "${deb//\~/.}" ] || mv "$deb" "${deb//\~/.}"
          done
          (cd dist && sha256sum *.deb > SHA256SUMS && cat SHA256SUMS)

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.bump-version.outputs.release-version }}
          body: ${{ needs.bump-version.outputs.release-notes }}
          # a, b and rc versions are pre-releases
          prerelease: ${{ contains(needs.bump-version.outputs.release-version, 'dev') || contains(needs.bump-version.outputs.release-version, 'a') || contains(needs.bump-version.outputs.release-version, 'b') || contains(needs.bump-version.outputs.release-version, 'rc') }}
          files: |
            dist/*.deb
            dist/SHA256SUMS
          token: "${{ secrets.PAT }}"
